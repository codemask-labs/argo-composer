[package]
name = "argo-composer"
version = "0.1.0"
edition = "2024"

[dependencies]
yaml = { workspace = true }

clap = { version = "4.5.47", features = ["derive"] }
cliclack = "0.3.6"
console = "0.16.1"

[workspace]
members = [
    ".",
    "lib/yaml",
    "lib/yaml-derive",
    "lib/yaml-tokenizer",
]

[workspace.dependencies]
yaml = { path = "./lib/yaml" }
yaml-derive = { path = "./lib/yaml-derive" }
yaml-tokenizer = { path = "./lib/yaml-tokenizer" }
