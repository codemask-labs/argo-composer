apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: example
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/example/argocd-resources
    path: example
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
